name: Live Provider Smoke Test

on:
  push:
    branches: [main]

jobs:
  groq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Verify Groq secret is configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"

      - name: Call Groq through AstraForge router
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio
          from astraforge.agents.factory import build_router
          from astraforge.providers.base import ModelRequest

          async def main():
              router = build_router()
              response = await router.generate(
                  ModelRequest(
                      prompt="Reply with exactly: ASTRAFORGE_LIVE_OK",
                      max_tokens=150,
                  ),
                  role="general",
              )
              assert "ASTRAFORGE_LIVE_OK" in response.text
              print(f"provider={response.provider} model={response.model}")

          asyncio.run(main())
          PY
