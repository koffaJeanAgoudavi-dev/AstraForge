name: Backend checks

on:
  push:
    branches:
      - main
      - feature/remote-sandbox-deployment
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,sandbox]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Build Docker sandbox image
        run: docker build -f docker/sandbox/Dockerfile -t astraforge-sandbox:latest .
      - name: Run test suite
        run: python -m pytest -q
