name: Deploy Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AstraForge
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          echo "Cloudflare secrets are configured."

      - name: Verify Wrangler
        run: npx --yes wrangler@latest --version

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from astrforge.integrations.deployment import CloudflarePagesDeployer

          deployer = CloudflarePagesDeployer(
              api_token=os.environ["CLOUDFLARE_API_TOKEN"],
              account_id=os.environ["CLOUDFLARE_ACCOUNT_ID"],
              project_name=os.environ["CLOUDFLARE_PAGES_PROJECT"],
              output_dir=".",
          )
          result = deployer.deploy(Path("."))
          print(result)
          PY
