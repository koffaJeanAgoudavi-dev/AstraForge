[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astraforge"
version = "0.1.0"
description = "A modular multi-provider AI software engineering agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "groq>=0.30,<1.0",
  "google-genai>=1.0,<2.0",
  "openai>=1.50,<2.0",
  "PyGithub>=2.5,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/astraforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
